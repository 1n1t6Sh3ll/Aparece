services:
  api:
    image: ghcr.io/1n1t6sh3ll/aparece:latest  # published image; `docker compose up --build` builds locally
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MODEL_BACKEND: ${MODEL_BACKEND:-rules}
      MONITOR_ENABLED: ${MONITOR_ENABLED:-0}
      BENCHMARK_MAX_USD: ${BENCHMARK_MAX_USD:-}
      # Optional paid features; unset means the free writers only. Values come from your shell or .env.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SHOOTOUT_LIVE_MAX_USD: ${SHOOTOUT_LIVE_MAX_USD:-0.05}
      SHOOTOUT_LIVE_DAILY_USD: ${SHOOTOUT_LIVE_DAILY_USD:-1}
      VISIBILITY_LIVE_MAX_USD: ${VISIBILITY_LIVE_MAX_USD:-0.05}
      VISIBILITY_LIVE_DAILY_USD: ${VISIBILITY_LIVE_DAILY_USD:-1}
    volumes:
      - monitor-data:/app/monitor/data
    restart: unless-stopped

volumes:
  monitor-data:
