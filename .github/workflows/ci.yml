name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r dataset/requirements.txt
      - run: python -m unittest discover -s dataset/tests -v
      - run: python -m py_compile train/*.py
      - run: pip install -r api/requirements.txt
      - run: python -m unittest discover -s api/tests -v
      - run: python -m unittest discover -s analysis/tests -t .
