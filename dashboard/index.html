<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProductLens Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="top">
    <div class="brand">ProductLens <span class="muted">merchant dashboard</span></div>
    <nav aria-label="Views">
      <a href="#product" data-view="product">Product</a>
      <a href="#dataset" data-view="dataset">Dataset</a>
      <a href="#models" data-view="models">Models</a>
    </nav>
  </header>

  <main id="main" tabindex="-1">
    <section id="view-product" class="view" aria-labelledby="h-product">
      <h1 id="h-product">Product</h1>
      <form id="search" class="search" role="search">
        <label for="q" class="sr-only">Search products</label>
        <input id="q" type="search" placeholder="Search by title, brand, type, merchant…" autocomplete="off">
        <button type="submit">Search</button>
      </form>
      <ul id="results" class="results" aria-label="Search results"></ul>
      <div id="product" aria-live="polite"></div>
    </section>

    <section id="view-dataset" class="view" aria-labelledby="h-dataset" hidden>
      <h1 id="h-dataset">Dataset</h1>
      <div id="stats"></div>
    </section>

    <section id="view-models" class="view" aria-labelledby="h-models" hidden>
      <h1 id="h-models">Models</h1>
      <div id="models"></div>
    </section>
  </main>
  <footer class="foot muted">Numbers are shown as measured. No composite score; ranking effects are unmeasured until the benchmark runs.</footer>
</body>
</html>
