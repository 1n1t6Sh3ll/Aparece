<!doctype html>
<html>
<head><meta charset="utf-8"><title>PowerLens settings</title><link rel="stylesheet" href="style.css"></head>
<body>
  <h1>PowerLens settings</h1>
  <label for="apiBase">API base URL</label>
  <input id="apiBase" type="url" placeholder="http://localhost:8000">
  <label for="token">ProductLens access key (optional)</label>
  <input id="token" type="password" autocomplete="off" placeholder="Paste the key shown when you created your profile">
  <p class="muted">Stored on this device only. It lets the popup show your company and save products to your report.</p>
  <p><button id="save">Save</button> <button id="forget">Forget key</button> <span id="msg" class="muted"></span></p>
  <script src="common.js"></script>
  <script src="options.js"></script>
</body>
</html>
