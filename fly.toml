# Fly.io deploy config (see "Deploy" in README.md). App names are global: change `app` to a free name,
# or run `fly launch --copy-config --no-deploy` and pick one when asked.
app = "aparece"

[build]
  dockerfile = "Dockerfile"

[env]
  MODEL_BACKEND = "rules"
  PRODUCTLENS_DATA = "/data/peers.jsonl"
  PROFILE_DB = "/data/profile.db"
  MONITOR_DB = "/data/monitor.db"
  GOVERNANCE_DB = "/data/governance.db"
  WEBHOOKS_DB = "/data/webhooks.db"
  EXPERIMENTS_DB = "/data/experiments.db"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # Keep one machine running: the spend caps and the 24 h cache live in the process's memory.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/v1/health"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
